version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: uneat-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - uneat-network

  app:
    build: .
    container_name: uneat-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5173:5173"
    depends_on:
      - mongodb
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/portal-productos
      JWT_SECRET: clave_super_secreta
      JWT_EXPIRES_IN: 12h
      ADMIN_CODE: admin1234
    volumes:
      - ./uploads:/app/uploads
    networks:
      - uneat-network

networks:
  uneat-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local