services:
  mongodb:
    image: public.ecr.aws/docker/library/mongo:7
    container_name: uneat-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uneat-network

  app:
    build: .
    container_name: uneat-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5173:5173"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - uneat-network

networks:
  uneat-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local