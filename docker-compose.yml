version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: uneat-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - uneat-network

  app:
    build: .
    container_name: uneat-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5173:5173"
    depends_on:
      - mongodb
    env_file:
      - .env
    volumes:
      - .:/app                # Montar todo el proyecto
      - /app/node_modules     # Excluir node_modules
    networks:
      - uneat-network

networks:
  uneat-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local