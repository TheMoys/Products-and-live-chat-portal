services:
  mongodb:
    image: public.ecr.aws/docker/library/mongo:7
    container_name: uneat-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uneat-network

  # Backend Python FastAPI
  backend:
    build: .
    container_name: uneat-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - uneat-network
    command: sh -c "cd /app/src && python -m uvicorn app.main:app --host 0.0.0.0 --port 3000"

  # Frontend Svelte
  frontend:
    image: node:20-alpine
    container_name: uneat-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - .:/app
    networks:
      - uneat-network
    command: sh -c "cd /app/src/frontend && npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://backend:3000

networks:
  uneat-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local